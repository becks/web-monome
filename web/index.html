<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e5"><title>web monome · Grid + Arc</title>
<style>
:root{color-scheme:light;font:500 14px "Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;background:#f4f0e5;color:#292720}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:clamp(16px,3vw,42px) clamp(12px,5vw,76px);display:flex;flex-direction:column;gap:28px;background:radial-gradient(ellipse at 50% -20%,#fffdf6 0,#f8f3e6 39%,#e9e2d0 100%)}body:before{content:"";position:fixed;z-index:-1;inset:0;opacity:.3;background-image:linear-gradient(#b9af9a12 1px,transparent 1px),linear-gradient(90deg,#b9af9a12 1px,transparent 1px);background-size:28px 28px;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;max-width:1300px;width:100%;align-self:center}h1{font-size:20px;letter-spacing:-1px;margin:0;font-weight:700;display:flex;align-items:center;gap:12px}h1:before{content:"";display:block;width:11px;height:11px;border-radius:50%;background:#ffd245;box-shadow:0 0 0 4px #f0c64028}h1 small{font:500 10px ui-monospace,"SFMono-Regular",Menlo,monospace;color:#867f70;letter-spacing:1.4px;padding-left:12px;border-left:1px solid #cbc3b3}button,select{font:500 12px ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.1px;background:#faf7ee;color:#403b30;border:1px solid #d9d1c0;border-radius:8px;padding:9px 13px;cursor:pointer;box-shadow:0 1px 1px #5a493112;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}button:hover{background:#fffdf6;border-color:#bdb19a;box-shadow:0 3px 8px #5a49311a;transform:translateY(-1px)}button:active{transform:translateY(0);box-shadow:none}button:focus-visible,canvas:focus-visible{outline:2px solid #db9e13;outline-offset:4px}button.active{background:#ffd34c;color:#48350a;border-color:#eab933;box-shadow:inset 0 1px #fff4ae,0 2px 5px #b27a1e26}nav{display:flex;gap:5px;padding:4px;border:1px solid #ddd5c5;border-radius:11px;background:#eee8db}nav button{border-color:transparent;box-shadow:none}nav button:hover{border-color:#d4c7ae;box-shadow:none}#status{font:500 11px ui-monospace,"SFMono-Regular",Menlo,monospace;color:#8c8474;padding:7px 10px;border-radius:99px;background:#ebe5d8}#status.ready{color:#67531c;background:#fff0b9}main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;width:100%;max-width:1300px;align-self:center}.surface{position:relative;overflow:hidden;border:1px solid #cfc6b4;border-radius:22px;padding:clamp(12px,2.2vw,30px);background:linear-gradient(145deg,#fffdf7,#ebe4d5);box-shadow:0 18px 55px #6d583525,0 2px 3px #6d58351a}.surface:after{content:"";position:absolute;inset:7px;border:1px solid #fffdf799;border-radius:16px;pointer-events:none}.label{position:relative;z-index:1;font:500 10px ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:1.5px;color:#817969;display:flex;justify-content:space-between;margin-bottom:16px}.label span:last-child{color:#aa9161}canvas{position:relative;z-index:1;display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}#grid{aspect-ratio:2;border-radius:10px;box-shadow:inset 0 0 0 1px #c9c0ad}#arcs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.3vw,34px)}.ring{padding:clamp(3px,.7vw,8px);border:1px solid #d7cdbb;border-radius:14px;background:#f8f4ea;box-shadow:inset 0 1px #fff}.ring canvas{aspect-ratio:1}.ring button{font-size:10px;margin:4px 0 0;padding:6px 13px;touch-action:none;text-transform:uppercase;letter-spacing:.8px}.ring button:active{background:#ffd34c;border-color:#eab933}footer{max-width:1300px;width:100%;align-self:center;display:flex;justify-content:space-between;gap:10px;color:#887f6e;font:500 10px ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.15px;flex-wrap:wrap}#notice{font:500 11px ui-monospace,"SFMono-Regular",Menlo,monospace;color:#966f10;min-height:16px;margin:0;text-align:center}body[data-view="grid"] #arcPanel,body[data-view="arc"] #gridPanel{display:none}body[data-view="both"] #arcPanel{max-width:850px;width:100%;align-self:center}body[data-view="arc"] #arcPanel{width:100%}@media(max-width:600px){body{padding:14px 10px;gap:18px}header{gap:12px}h1{font-size:18px}h1 small{display:none}#status{order:3}button{padding:8px 10px}.surface{border-radius:15px;padding:11px}.surface:after{inset:4px;border-radius:11px}#arcs{gap:4px}.ring{padding:2px;border-radius:8px}.label{font-size:8px;margin-bottom:10px}.ring button{padding:5px 7px;font-size:8px}footer{line-height:1.5}}
</style></head><body data-view="both">
<header><h1>web monome <small>NORNS COMPANION</small></h1><nav aria-label="View"><button data-view="grid">Grid</button><button data-view="arc">Arc</button><button data-view="both" class="active">Both</button></nav><span id="status" role="status">Connecting…</span><button id="fullscreen" aria-label="Fullscreen">⛶</button></header>
<main><section class="surface" id="gridPanel"><div class="label"><span>GRID <span id="dimensions">128 · 16 × 8</span></span><span>TOUCH / PRESS</span></div><canvas id="grid" aria-label="Multitouch virtual Grid"></canvas></section><section class="surface" id="arcPanel"><div class="label"><span>ARC · 4</span><span>DRAG ↑ ↓ · SCROLL</span></div><div id="arcs"></div></section><p id="notice" role="status"></p></main>
<footer><span id="hint">Load a script on Norns. LEDs follow the script.</span><span>local network · no browser audio · v0.1.2</span></footer><script src="/app.js"></script></body></html>
