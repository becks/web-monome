<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dedfdd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="web monome">
  <title>web monome · Grid + Arc</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply the saved theme before the first paint, so the page does not flash.
    try {
      const t = localStorage.getItem('web-monome-theme');
      const auto = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = !t || t === 'auto' ? auto : t;
    } catch {}
  </script>
</head>
<body data-view="both">
  <header>
    <h1>web monome <small>NORNS COMPANION</small></h1>
    <nav aria-label="View">
      <button data-view="grid">Grid</button>
      <button data-view="arc">Arc</button>
      <button data-view="both" class="active">Both</button>
    </nav>
    <div class="tools">
      <span id="status" role="status">Connecting…</span>
      <label class="visually-hidden" for="theme">Theme</label>
      <select id="theme" title="Theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Graphite</option>
        <option value="amber">Amber</option>
        <option value="ocean">Ocean</option>
        <option value="night">Night</option>
      </select>
      <button id="fullscreen" aria-label="Fullscreen">⛶</button>
    </div>
  </header>

  <main>
    <section class="surface" id="gridPanel">
      <div class="label">
        <span>GRID <span id="dimensions">128 · 16 × 8</span></span>
        <span>TOUCH / PRESS</span>
      </div>
      <canvas id="grid" aria-label="Multitouch virtual Grid"></canvas>
    </section>

    <section class="surface" id="arcPanel">
      <div class="label">
        <span>ARC · 4</span>
        <button id="fine" aria-pressed="false" title="Finer adjustment (also: hold Shift)">fine</button>
        <span>DRAG ↑ ↓ · SCROLL</span>
      </div>
      <div id="arcs"></div>
    </section>

    <p id="notice" role="status"></p>
  </main>

  <footer>
    <span id="hint">Load a script on Norns. LEDs follow the script.</span>
    <span>local network · no browser audio · <span id="version"></span></span>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
