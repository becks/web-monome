<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e5"><title>web monome · Grid + Arc</title>
<style>

order-color:#aaada8;box-shadow:none}#status{font:500 11px ui-monospace,"SFMono-Regular",Menlo,monospace;color:#71746f;padding:7px 10px;border-radius:99px;background:#d9dbd7}#status.ready{color:#3d423d;background:#f4f5f1;box-shadow:inset 0 0 0 1px #c4c7c1}main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;width:100%;max-width:1300px;align-self:center}.surface{position:relative;overflow:hidden;border:1px solid #afb2ac;border-radius:22px;padding:clamp(12px,2.2vw,30px);background:linear-gradient(145deg,#f5f6f3,#d3d5d0);box-shadow:0 18px 55px #4b50422b,0 2px 3px #4b50421d}.surface:after{content:"";position:absolute;inset:7px;border:1px solid #ffffff8f;border-radius:16px;pointer-events:none}.label{position:relative;z-index:1;font:500 10px ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:1.5px;color:#626660;display:flex;justify-content:space-between;margin-bottom:16px}.label span:last-child{color:#8a8d87}canvas{position:relative;z-index:1;display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}#grid{aspect-ratio:2;border-radius:10px;box-shadow:inset 0 0 0 1px #9b9f98}#arcs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.3vw,34px)}.ring{padding:clamp(3px,.7vw,8px);border:1px solid #bfc1bd;border-radius:14px;background:#e7e8e4;box-shadow:inset 0 1px #fff}.ring canvas{aspect-ratio:1}.ring button{font-size:10px;margin:4px 0 0;padding:6px 13px;touch-action:none;text-transform:uppercase;letter-spacing:.8px}.ring button:active{background:#555854;border-color:#414440;color:#fff}footer{max-width:1300px;width:100%;align-self:center;display:flex;justify-content:space-between;gap:10px;color:#6f736d;font:500 10px ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.15px;flex-wrap:wrap}#notice{font:500 11px ui-monospace,"SFMono-Regular",Menlo,monospace;color:#555a54;min-height:16px;margin:0;text-align:center}body[data-view="grid"] #arcPanel,body[data-view="arc"] #gr
