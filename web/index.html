<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101210"><title>web monome · Grid + Arc</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101210;color:#dedfd5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px clamp(12px,4vw,64px);display:flex;flex-direction:column;gap:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:18px;letter-spacing:-.6px;margin:0;font-weight:500}h1 small{font-size:11px;color:#838a7a;letter-spacing:2px;margin-left:12px}button,select{font:inherit;background:#222620;color:#dee3d5;border:1px solid #3b4435;border-radius:8px;padding:10px 14px;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:2px solid #c7e69e;outline-offset:4px}button.active{background:#c7e69e;color:#182014;border-color:#c7e69e}nav{display:flex;gap:6px}#status{font-size:12px;color:#a3aa98}#status.ready{color:#c7e69e}main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;width:100%;max-width:1300px;align-self:center}.surface{border:1px solid #33392e;border-radius:18px;padding:clamp(10px,2vw,28px);background:#171b15;box-shadow:0 16px 60px #0004}.label{font-size:10px;letter-spacing:2px;color:#89917e;display:flex;justify-content:space-between;margin-bottom:14px}canvas{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}#grid{aspect-ratio:2}#arcs{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(4px,2vw,28px)}.ring canvas{aspect-ratio:1}.ring{text-align:center}.ring button{font-size:11px;margin-top:4px;padding:6px 12px;touch-action:none}footer{display:flex;justify-content:space-between;gap:10px;color:#818a77;font-size:11px;flex-wrap:wrap}#notice{color:#c7e69e;min-height:16px;margin:0}body[data-view="grid"] #arcPanel,body[data-view="arc"] #gridPanel{display:none}body[data-view="both"] #arcPanel{max-width:850px;width:100%;align-self:center}body[data-view="arc"] #arcPanel{width:100%}@media(max-width:600px){body{padding:14px 10px;gap:18px}header{gap:16px}h1 small{display:none}button{padding:9px 11px}.surface{border-radius:12px}#arcs{gap:2px}.label{font-size:9px}.ring button{padding:6px 8px}footer{line-height:1.5}}
</style></head><body data-view="both">
<header><h1>web monome <small>NORNS COMPANION</small></h1><nav aria-label="View"><button data-view="grid">Grid</button><button data-view="arc">Arc</button><button data-view="both" class="active">Both</button></nav><span id="status" role="status">Connecting…</span><button id="fullscreen" aria-label="Fullscreen">⛶</button></header>
<main><section class="surface" id="gridPanel"><div class="label"><span>GRID <span id="dimensions">128 · 16 × 8</span></span><span>TOUCH / PRESS</span></div><canvas id="grid" aria-label="Multitouch virtual Grid"></canvas></section><section class="surface" id="arcPanel"><div class="label"><span>ARC · 4</span><span>DRAG ↑ ↓ · SCROLL</span></div><div id="arcs"></div></section><p id="notice" role="status"></p></main>
<footer><span id="hint">Load a script on Norns. LEDs follow the script.</span><span>local network · no browser audio · v0.1.2</span></footer><script src="/app.js"></script></body></html>
